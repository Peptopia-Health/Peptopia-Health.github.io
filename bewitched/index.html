<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peptopia Potions — Creator's Den</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#7CFC00; --violet:#b388ff; --cyan:#4de8ff; --amber:#ffc44d;
  --magenta:#ff4dd8; --ember:#ff7a4d; --ink:#ece8f7; --dim:#a79cc4;
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  --disp:'Outfit','DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#07040d;color:var(--ink);font-family:var(--sans);overflow-x:hidden}
body{background:#04020a;min-height:100vh}
button{font-family:inherit}

.bgplate{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;z-index:0;filter:saturate(1.28) contrast(1.09) brightness(1.03)}
.edgefade{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(118% 92% at 50% 42%,transparent 52%,rgba(2,0,6,.55) 82%,rgba(1,0,4,.94) 100%)}
header.topbar{position:relative;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px;max-width:1280px;margin:0 auto}
h1.title{font-family:var(--disp);font-weight:800;font-size:clamp(25px,4.1vw,41px);margin:0;letter-spacing:.4px;color:#f3eaff;text-shadow:0 0 18px rgba(124,252,0,.35),0 0 42px rgba(179,136,255,.35)}
h1.title .thin{color:var(--lime);font-style:italic;font-weight:700}
.sub{margin:3px 0 0;font-size:clamp(12px,1.6vw,14.5px);color:var(--dim);font-style:italic}
.rune-btn{background:rgba(20,12,36,.8);border:1px solid #4a3577;color:var(--ink);border-radius:999px;padding:8px 15px;cursor:pointer;font-size:13.5px;font-family:var(--sans)}
.rune-btn:hover{border-color:var(--lime);box-shadow:0 0 12px rgba(124,252,0,.35)}

/* ---------- scene ---------- */
.scene{position:relative;z-index:2;max-width:1280px;margin:0 auto;height:min(54vh,600px);min-height:380px;overflow:hidden;background:transparent}
#davidWrap{position:absolute;left:50%;top:-1%;height:118%;transform:translateX(-50%);z-index:6;animation:idleSway 6s ease-in-out infinite;transform-origin:50% 92%;cursor:pointer}
#davidWrap img{height:100%;display:block;filter:drop-shadow(0 10px 16px rgba(0,0,0,.45)) saturate(1.18) contrast(1.06);-webkit-mask-image:linear-gradient(180deg,#000 0,#000 47%,rgba(0,0,0,.45) 62%,transparent 78%);mask-image:linear-gradient(180deg,#000 0,#000 47%,rgba(0,0,0,.45) 62%,transparent 78%)}
@keyframes idleSway{0%,100%{transform:translateX(-50%) rotate(-.6deg)}50%{transform:translateX(-50%) rotate(.6deg) translateY(-4px)}}
#davidWrap.casting{animation:castLean 1.15s ease-in-out}
@keyframes castLean{0%{transform:translateX(-50%) rotate(0)}30%{transform:translateX(-56%) rotate(-3deg) scale(1.03)}55%{transform:translateX(-45%) rotate(2.4deg) scale(1.03)}100%{transform:translateX(-50%) rotate(0)}}
#davidWrap.stirring{animation:stirRock .9s ease-in-out infinite}
@keyframes stirRock{0%,100%{transform:translateX(-50%) rotate(-1.6deg)}50%{transform:translateX(-50%) rotate(1.6deg) translateY(-3px)}}
.handglow{position:absolute;left:57.5%;top:11%;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,rgba(124,252,0,.75),rgba(57,255,106,.25) 55%,transparent 72%);opacity:0;z-index:7;pointer-events:none;filter:blur(2px)}
.handglow.on{animation:glowpulse 1.15s ease-in-out}
@keyframes glowpulse{0%{opacity:0;transform:scale(.5)}35%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.7)}}
#cauldronAnchor{position:absolute;right:9%;top:56%;width:120px;height:40px;z-index:8;pointer-events:none}
.droplet{position:absolute;width:8px;height:8px;border-radius:50% 50% 60% 60%;background:radial-gradient(circle at 36% 30%,#d8ffb0,#39ff6a);box-shadow:0 0 9px rgba(124,252,0,.9);z-index:26;pointer-events:none}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe98a;box-shadow:0 0 8px #ffd94d;pointer-events:none;z-index:26}

/* ---------- potions ---------- */
.potions{position:relative;z-index:20;max-width:1280px;margin:-58px auto 0;padding:0 14px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.potion{background:transparent;border:none;padding:10px 8px 11px;text-align:center;cursor:pointer;transition:transform .18s;position:relative}
.potion:hover{transform:translateY(-5px) scale(1.04)}
.potion:hover .flaskimg{filter:drop-shadow(0 0 26px rgba(255,255,255,.35))}
.potion{z-index:0}
.potion::before{content:"";position:absolute;inset:-16px -20px;background:radial-gradient(ellipse 60% 56% at 50% 44%,rgba(5,2,12,.86) 0%,rgba(5,2,12,.62) 52%,rgba(5,2,12,0) 76%);z-index:-1;pointer-events:none}
.fillglow{position:absolute;pointer-events:none;mix-blend-mode:screen;z-index:2;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.potion .flaskimg{mix-blend-mode:screen}
.bub{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(255,255,255,.12) 72%);opacity:0;pointer-events:none;animation:bubrise linear infinite;z-index:3}
@keyframes bubrise{0%{transform:translateY(0) scale(.55);opacity:0}16%{opacity:.9}100%{transform:translateY(-54px) scale(1);opacity:0}}
.wisp{position:absolute;border-radius:50%;filter:blur(3px);opacity:0;pointer-events:none;animation:wispup ease-in-out infinite;z-index:3}
@keyframes wispup{0%{transform:translateY(0) scale(.55);opacity:0}30%{opacity:.55}100%{transform:translateY(-48px) scale(1.55);opacity:0}}
.potion .flaskimg{height:104px;max-width:88%;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.7))}
.potion[data-fn="guide"] .flaskimg{filter:drop-shadow(0 0 19px rgba(124,252,0,.45)) brightness(1.2) saturate(1.45)}
.potion[data-fn="vendor"] .flaskimg{filter:drop-shadow(0 0 19px rgba(155,77,255,.5)) brightness(1.2) saturate(1.45)}
.potion[data-fn="news"] .flaskimg{filter:drop-shadow(0 0 19px rgba(77,232,255,.5)) brightness(1.2) saturate(1.45)}
.potion[data-fn="audio"] .flaskimg{filter:drop-shadow(0 0 19px rgba(255,157,46,.5)) brightness(1.2) saturate(1.45)}
.potion[data-fn="publish"] .flaskimg{filter:drop-shadow(0 0 19px rgba(255,77,216,.5)) brightness(1.2) saturate(1.45)}
.potion[data-fn="inventory"] .flaskimg{filter:drop-shadow(0 0 19px rgba(255,106,46,.55)) brightness(1.2) saturate(1.45)}
.potion .pname{font-family:var(--disp);font-weight:700;font-size:17px;line-height:1.18;margin-top:8px;text-shadow:0 2px 10px rgba(0,0,0,.9),0 0 18px rgba(0,0,0,.6)}
.potion .pdesc{font-size:11.5px;color:var(--dim);font-style:italic;margin-top:3px;line-height:1.4}
.potion.casting .pname{text-shadow:0 0 16px #fff,0 2px 10px rgba(0,0,0,.9)}

/* ---------- grimoire log ---------- */
.grimoire{position:relative;z-index:2;max-width:1280px;margin:16px auto 6px;padding:0 14px}
.logbox{background:linear-gradient(180deg,#150d2a,#0a0616);border:1px solid #4a3577;border-radius:14px;padding:14px 18px;min-height:118px;box-shadow:inset 0 0 34px rgba(60,30,120,.35)}
.logbox h3{font-family:var(--disp);margin:0 0 8px;font-size:13px;letter-spacing:2.5px;color:var(--lime);text-transform:uppercase}
#log{font-size:15.5px;line-height:1.65;color:#e7defc;white-space:pre-wrap;min-height:52px}
#log .who{color:var(--violet);font-style:italic}
.caret{display:inline-block;width:9px;height:17px;background:var(--lime);vertical-align:-2px;animation:caret .8s steps(1) infinite}
@keyframes caret{50%{opacity:0}}

/* ---------- vapor cloud ---------- */
#cloudWrap{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(3,2,8,.45)}
#cloudWrap.open{display:flex}
.cloud{position:relative;width:min(560px,92vw);padding:38px 40px 30px;color:#10240f;font-family:var(--sans);background:
  radial-gradient(120px 70px at 18% 24%,rgba(210,255,170,.95),transparent 70%),
  radial-gradient(200px 120px at 78% 16%,rgba(160,255,120,.9),transparent 70%),
  radial-gradient(260px 170px at 50% 60%,rgba(140,255,90,.92),transparent 75%),
  radial-gradient(150px 100px at 24% 82%,rgba(120,255,160,.9),transparent 70%),
  radial-gradient(170px 110px at 82% 84%,rgba(150,255,110,.9),transparent 70%),
  linear-gradient(160deg,#b9ff7d,#63e83c 55%,#37c928);
  border-radius:48% 52% 55% 45%/52% 46% 54% 48%;
  animation:blobmorph 9s ease-in-out infinite,cloudin .45s ease-out;
  box-shadow:0 0 90px rgba(124,252,0,.5),inset 0 0 60px rgba(255,255,255,.35)}
@keyframes blobmorph{0%,100%{border-radius:48% 52% 55% 45%/52% 46% 54% 48%}33%{border-radius:56% 44% 46% 54%/44% 58% 42% 56%}66%{border-radius:44% 56% 58% 42%/58% 44% 56% 42%}}
@keyframes cloudin{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
.cloud.out{animation:cloudout .5s ease-in forwards}
@keyframes cloudout{to{transform:scale(1.35);opacity:0;filter:blur(6px)}}
.cloud h2{font-family:var(--disp);margin:0 0 4px;font-size:24px;color:#0d2b08;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.cloud p{margin:4px 0 12px;font-size:14.5px;color:#17450e;font-style:italic}
.cloud label{display:block;font-size:12.5px;font-weight:700;letter-spacing:1px;color:#0d2b08;margin:10px 0 4px;text-transform:uppercase}
.cloud input,.cloud select{width:100%;padding:11px 13px;border-radius:10px;border:2px solid rgba(13,60,8,.4);background:rgba(255,255,240,.92);font-size:16px;font-family:var(--sans);color:#12260c}
.cloud input:focus,.cloud select:focus{outline:none;border-color:#0d5c06;box-shadow:0 0 0 3px rgba(20,120,10,.3)}
.cloud .row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.cast-btn{flex:1;background:linear-gradient(180deg,#2b1065,#170838);color:#eaffea;border:1px solid #9dff70;border-radius:999px;padding:12px 18px;font-size:16.5px;font-family:var(--disp);font-weight:700;cursor:pointer;box-shadow:0 0 18px rgba(20,255,90,.35)}
.cast-btn:hover{box-shadow:0 0 28px rgba(124,252,0,.75)}
.ghost-btn{background:transparent;border:1px solid rgba(13,60,8,.5);color:#17450e;border-radius:999px;padding:12px 16px;font-size:14.5px;cursor:pointer}
.cloud .attzone{margin-top:4px;border:2px dashed rgba(13,60,8,.45);border-radius:12px;padding:12px 13px;background:rgba(255,255,240,.55);font-size:14px;color:#17450e;cursor:pointer;text-align:center}
.cloud .attzone.drag{border-color:#0d5c06;background:rgba(255,255,240,.92)}
.cloud .attlist{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cloud .attchip{background:#173d0c;color:#eaffea;border-radius:999px;padding:4px 8px 4px 12px;font-size:12.5px;display:inline-flex;align-items:center;gap:7px}
.cloud .attchip button{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:50%;width:18px;height:18px;cursor:pointer;line-height:1;font-size:12px;padding:0}
.cloud .orb{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 32%,#eaffd0,#5df03c 65%,#23a313);box-shadow:0 0 10px rgba(60,255,60,.7);animation:orbrise linear forwards;pointer-events:none}
@keyframes orbrise{to{transform:translateY(-130px) scale(1.25);opacity:0}}
.rune-opt{display:block;width:100%;text-align:left;margin-top:9px;background:rgba(255,255,240,.85);border:2px solid rgba(13,60,8,.35);border-radius:12px;padding:11px 14px;font-size:15.5px;cursor:pointer;color:#12260c;font-family:var(--sans)}
.rune-opt:hover{border-color:#0d5c06;background:#fff}

/* ---------- spell scroll ---------- */
#davidFull{display:none}
#davidFull.open{display:flex;position:fixed;inset:0;z-index:66;background:radial-gradient(90% 90% at 50% 40%,rgba(10,26,8,.88),rgba(1,0,4,.96));align-items:flex-end;justify-content:center;cursor:zoom-out}
#davidFull img{height:min(94vh,1100px);max-width:94vw;object-fit:contain;filter:drop-shadow(0 18px 34px rgba(0,0,0,.7))}
#scrollWrap{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(3,2,8,.55)}
#scrollWrap.open{display:flex}
.scroll{width:min(600px,93vw);max-height:86vh;overflow:auto;background:linear-gradient(175deg,#f4ead0,#e4d3a8 60%,#d9c48f);color:#2c1c08;border-radius:8px;padding:28px 30px;box-shadow:0 24px 70px rgba(0,0,0,.75),inset 0 0 44px rgba(140,100,30,.35);animation:cloudin .4s ease-out;font-family:var(--sans)}
.scroll h2{font-family:var(--disp);margin:0 0 6px;font-size:22px;color:#4a2c05}
.scroll p{font-size:14px;font-style:italic;color:#5c421a;margin:4px 0 12px}
.scroll pre{white-space:pre-wrap;background:rgba(90,60,10,.10);border:1px dashed rgba(90,60,10,.45);border-radius:8px;padding:13px 15px;font-size:15.5px;font-family:var(--sans);color:#2c1c08}
.scroll .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.scroll .cast-btn{flex:1}

@media (max-width:760px){
  .scene{height:46vh;min-height:320px}
  .potions{grid-template-columns:repeat(3,1fr);margin-top:-26px}
  .potion .flaskimg{height:84px}
  #davidWrap{height:112%;left:50%}
  .cat-gray{width:116px} .cat-tabby{width:102px}   .handglow{left:56%}
}
footer.den{position:relative;z-index:2;max-width:1280px;margin:8px auto 26px;padding:0 18px;color:#6f6390;font-size:12.5px;font-style:italic;text-align:center}
</style>
</head>

<script>
(function(){
"use strict";
var $ = function(s){return document.querySelector(s)};
var logEl = $("#log"), david = $("#davidWrap"), glow = $("#handGlow"), scene = $("#scene");
var soundOn = true, busy = false;

$("#soundBtn").addEventListener("click", function(){
  soundOn = !soundOn;
  this.textContent = soundOn ? "🔊" : "🔇";
});
document.addEventListener("click", function(){ chuckle(); });
function chuckle(){ if(!soundOn) return; var a = $("#chuckle"); try{ a.currentTime = 0; a.play(); }catch(e){} }

var typeTimer = null;
function typeLog(html){
  if(typeTimer) clearInterval(typeTimer);
  logEl.innerHTML = "";
  var tmp = document.createElement("div"); tmp.innerHTML = html;
  var plain = tmp.textContent, i = 0;
  var caret = document.createElement("span"); caret.className = "caret";
  logEl.appendChild(caret);
  typeTimer = setInterval(function(){
    i++;
    logEl.textContent = plain.slice(0, i);
    logEl.appendChild(caret);
    if(i >= plain.length){ clearInterval(typeTimer); typeTimer = null; logEl.innerHTML = html; }
  }, 16);
}
function logLines(lines, done){
  var idx = 0;
  (function next(){
    if(idx >= lines.length){ if(done) done(); return; }
    typeLog(lines[idx]); idx++;
    setTimeout(next, 1500 + Math.random()*900);
  })();
}


function droplet(fromEl){
  var r = fromEl.getBoundingClientRect(), sr = scene.getBoundingClientRect();
  var d = document.createElement("div"); d.className = "droplet";
  var x = r.left - sr.left + r.width*(0.3+Math.random()*0.4), y = r.top - sr.top + 6;
  d.style.left = x + "px"; d.style.top = y + "px";
  scene.appendChild(d);
  var vx = (Math.random()*70 - 35), vy = -60 - Math.random()*50, t = 0;
  var fall = setInterval(function(){
    t += 0.03; vy += 340*0.03;
    x += vx*0.03; y += vy*0.03;
    d.style.left = x + "px"; d.style.top = y + "px";
    if(t > 1.15){ clearInterval(fall); d.style.transition = "opacity .3s"; d.style.opacity = 0; setTimeout(function(){ d.remove(); }, 320); }
  }, 30);
}
setInterval(function(){ if(Math.random() < .55) droplet($("#cauldronAnchor")); }, 4200);

setInterval(function(){
  if(Math.random() < .5) return;
  var s = document.createElement("div"); s.className = "spark";
  s.style.left = (12 + Math.random()*76) + "%"; s.style.top = (30 + Math.random()*55) + "%";
  scene.appendChild(s);
  s.animate([{transform:"translateY(0)", opacity:1},{transform:"translateY(-46px)", opacity:0}], {duration:2100, easing:"ease-out"});
  setTimeout(function(){ s.remove(); }, 2200);
}, 1600);


var GLOW = {guide:"124,252,0", vendor:"179,136,255", news:"77,232,255", audio:"255,196,77", publish:"255,77,216", inventory:"255,122,77"};
document.querySelectorAll(".potion").forEach(function(p, pi){
  var rgb = GLOW[p.dataset.fn] || "255,255,255", i, el;
  for(i = 0; i < 5; i++){
    el = document.createElement("i"); el.className = "bub";
    var sz = 4 + ((pi*3+i) % 3) * 1.7;
    el.style.width = el.style.height = sz.toFixed(1) + "px";
    el.style.left = "calc(50% + " + ((i-1)*13 + (pi%3)*3 - 3) + "px)";
    el.style.bottom = (56 + (i*7 + pi*3) % 24) + "px";
    el.style.animationDuration = (1.7 + Math.random() * 2.3) + "s";
    el.style.animationDelay = (Math.random() * 2.6) + "s";
    p.appendChild(el);
  }
  for(i = 0; i < 4; i++){
    el = document.createElement("i"); el.className = "wisp";
    el.style.width = (20 + i*9) + "px"; el.style.height = (13 + i*5) + "px";
    el.style.left = "calc(50% + " + ((i % 2 ? 9 : -17) + Math.floor(i / 2) * 5) + "px)";
    el.style.top = "0px";
    el.style.background = "radial-gradient(circle,rgba(" + rgb + ",.5),rgba(" + rgb + ",0) 70%)";
    el.style.animationDuration = (2.9 + Math.random() * 3.4) + "s";
    el.style.animationDelay = (Math.random() * 3.4) + "s";
    p.appendChild(el);
  }
});

var LEVELS = {guide:.55, vendor:.36, news:.66, audio:.8, publish:.44, inventory:.92};
document.querySelectorAll(".potion").forEach(function(p){
  var img = p.querySelector(".flaskimg"); if(!img) return;
  var rgb = GLOW[p.dataset.fn] || "255,255,255";
  var fg = document.createElement("div"); fg.className = "fillglow";
  fg.style.background = "linear-gradient(180deg, rgba(" + rgb + ",.8), rgba(" + rgb + ",.26) 14%, rgba(" + rgb + ",.16))";
  fg.style.webkitMaskImage = 'url("' + img.src + '")';
  fg.style.maskImage = 'url("' + img.src + '")';
  p.appendChild(fg);
});
function layFill(){
  document.querySelectorAll(".potion").forEach(function(p){
    var img = p.querySelector(".flaskimg"), fg = p.querySelector(".fillglow");
    if(!img || !fg) return;
    var lvl = LEVELS[p.dataset.fn] || .55, h = img.offsetHeight * lvl;
    fg.style.left = img.offsetLeft + "px";
    fg.style.top = (img.offsetTop + img.offsetHeight - h) + "px";
    fg.style.width = img.offsetWidth + "px";
    fg.style.height = h + "px";
  });
}
window.addEventListener("load", layFill);
window.addEventListener("resize", layFill);
setTimeout(layFill, 350);

var cloudWrap = $("#cloudWrap"), cloud = $("#cloud"), current = null, values = {};
function openCloud(html){
  cloud.innerHTML = html;
  cloud.classList.remove("out");
  cloudWrap.classList.add("open");
  for(var i = 0; i < 9; i++){
    var o = document.createElement("span"); o.className = "orb";
    var sz = 6 + Math.random()*13;
    o.style.width = o.style.height = sz + "px";
    o.style.left = (8 + Math.random()*84) + "%";
    o.style.bottom = (6 + Math.random()*20) + "%";
    o.style.animationDuration = (1.6 + Math.random()*1.8) + "s";
    cloud.appendChild(o);
    setTimeout(function(el){ el.remove(); }, 3600, o);
  }
}
function closeCloud(then){
  cloud.classList.add("out");
  setTimeout(function(){ cloudWrap.classList.remove("open"); if(then) then(); }, 480);
}
function formHTML(fn){
  var f = FUNCS[fn], h = "<h2>" + f.icon + " " + f.name + "</h2><p>" + f.intro + "</p>";
  f.fields.forEach(function(fd){
    h += "<label for='cf-" + fd.id + "'>" + fd.label + "</label>";
    if(fd.type === "select"){
      h += "<select id='cf-" + fd.id + "'>" + fd.opts.map(function(o){ return "<option>" + o + "</option>"; }).join("") + "</select>";
    } else {
      h += "<input id='cf-" + fd.id + "' type='text' placeholder='" + (fd.ph || "") + "' autocomplete='off'>";
    }
  });
  h += "<label>Attach references (optional)</label><div class='attzone' id='attZone'>📎 Tap to attach files — or drop them here<div class='attlist' id='attList'></div></div><input type='file' id='cf-files' multiple hidden>";
  h += "<div class='row'><button class='cast-btn' id='castBtn'>✨ Cast the Spell</button><button class='ghost-btn' id='cancelBtn'>Let it fade</button></div>";
  return h;
}

var attachments = [];
function renderAttChips(){
  var list = document.getElementById("attList"); if(!list) return;
  list.innerHTML = "";
  attachments.forEach(function(f, i){
    var chip = document.createElement("span"); chip.className = "attchip";
    chip.textContent = "📎 " + f.name + " (" + Math.max(1, Math.round(f.size/1024)) + " KB)";
    var x = document.createElement("button"); x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", "Remove " + f.name);
    x.addEventListener("click", function(ev){ ev.stopPropagation(); attachments.splice(i, 1); renderAttChips(); });
    chip.appendChild(x); list.appendChild(chip);
  });
}
function wireAttachments(){
  var zone = document.getElementById("attZone"), input = document.getElementById("cf-files");
  if(!zone || !input) return;
  zone.addEventListener("click", function(){ input.click(); });
  input.addEventListener("change", function(){ for(var i = 0; i < input.files.length; i++) attachments.push(input.files[i]); input.value = ""; renderAttChips(); });
  zone.addEventListener("dragover", function(e){ e.preventDefault(); zone.classList.add("drag"); });
  zone.addEventListener("dragleave", function(){ zone.classList.remove("drag"); });
  zone.addEventListener("drop", function(e){ e.preventDefault(); zone.classList.remove("drag"); if(e.dataTransfer) for(var i = 0; i < e.dataTransfer.files.length; i++) attachments.push(e.dataTransfer.files[i]); renderAttChips(); });
}
function attachmentBlock(done){
  if(!attachments.length){ done(""); return; }
  var block = "\n\nAttached references (I will attach these files in the chat with this message): " + attachments.map(function(f){ return f.name; }).join(", ");
  var texty = attachments.filter(function(f){ return /\.(txt|md|csv|json|html|xml|log)$/i.test(f.name) && f.size <= 20000; });
  if(!texty.length){ done(block); return; }
  var parts = [], left = texty.length;
  texty.forEach(function(f){
    var r = new FileReader();
    r.onload = function(){ parts.push("\n\n--- Reference: " + f.name + " ---\n" + String(r.result).slice(0, 12000)); if(--left === 0) done(block + parts.join("")); };
    r.onerror = function(){ if(--left === 0) done(block + parts.join("")); };
    r.readAsText(f);
  });
}
function openFunc(fn){
  if(busy) return;
  current = fn; values = {}; attachments = [];
  david.classList.remove("casting"); void david.offsetWidth; david.classList.add("casting");
  glow.classList.remove("on"); void glow.offsetWidth; glow.classList.add("on");
  document.querySelectorAll(".potion").forEach(function(p){ p.classList.toggle("casting", p.dataset.fn === fn); });
  setTimeout(function(){ openCloud(formHTML(fn));
    $("#cancelBtn").addEventListener("click", function(){ closeCloud(); clearCasting(); typeLog("<span class='who'>The vapor sighs and thins…</span> The spell is uncast. The potions hum on, patient as cats."); });
    $("#castBtn").addEventListener("click", castSpell);
    wireAttachments();
    var first = cloud.querySelector("input,select"); if(first) first.focus();
  }, 620);
}
function clearCasting(){
  document.querySelectorAll(".potion").forEach(function(p){ p.classList.remove("casting"); });
  david.classList.remove("stirring");
}
function collect(){
  var f = FUNCS[current], ok = true;
  f.fields.forEach(function(fd){
    var el = document.getElementById("cf-" + fd.id);
    values[fd.id] = el ? el.value.trim() : "";
    if(fd.req && !values[fd.id]){ ok = false; if(el) el.style.borderColor = "#c21"; }
  });
  return ok;
}
function castSpell(){
  if(!collect()){ typeLog("<span class='who'>The brew sputters…</span> A required ingredient is missing — fill the glowing field, then cast again."); return; }
  var f = FUNCS[current];
  closeCloud(function(){
    busy = true; david.classList.add("stirring");
    logLines(f.lines(values), function(){
      if(f.followup){ askFollowup(f); }
      else { finishSpell(); }
    });
  });
}
function askFollowup(f){
  var h = "<h2>🌫️ The vapor asks…</h2><p>" + f.followup.q + "</p>";
  f.followup.opts.forEach(function(o, i){ h += "<button class='rune-opt' data-i='" + i + "'>" + o + "</button>"; });
  openCloud(h);
  cloud.querySelectorAll(".rune-opt").forEach(function(b){
    b.addEventListener("click", function(){
      values[f.followup.key] = f.followup.opts[+b.dataset.i];
      closeCloud(function(){ finishSpell(); });
    });
  });
}
function finishSpell(){
  busy = false; clearCasting();
  var f = FUNCS[current];
  attachmentBlock(function(extra){
  var cmd = f.command(values) + extra;
  typeLog("✨ <span class='who'>The spell is sealed in a scroll.</span> One whisper delivers it to Muse, who brews it in earnest — research first, findings in your chat, and nothing published without your word.");
  var sc = $("#scroll");
  sc.innerHTML = "<h2>📜 Your Spell Scroll — " + f.name + "</h2>" +
    "<p>Whisper this to Muse and the work begins in earnest. Approvals only you can grant will appear in the chat as cards to tap.</p>" +
    "<pre id='cmdText'></pre>" +
    "<div class='row'><button class='cast-btn' id='copyBtn'>🕊️ Copy &amp; open Muse</button><button class='ghost-btn' id='scrollClose' style='border-color:rgba(90,60,10,.5);color:#5c421a'>Keep it in the den</button></div>";
  document.getElementById("cmdText").textContent = cmd;
  $("#scrollWrap").classList.add("open");
  $("#copyBtn").addEventListener("click", function(){
    var t = document.getElementById("cmdText").textContent;
    if(navigator.clipboard) navigator.clipboard.writeText(t);
    window.open("https://muse.ai", "_blank");
    this.textContent = "🕊️ Copied — paste it in the chat & the brewing begins";
  });
  $("#scrollClose").addEventListener("click", function(){ $("#scrollWrap").classList.remove("open"); });
  });
}
document.querySelectorAll(".potion").forEach(function(p){
  p.addEventListener("click", function(){ openFunc(p.dataset.fn); });
  p.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openFunc(p.dataset.fn); } });
});
cloudWrap.addEventListener("click", function(e){ if(e.target === cloudWrap && !busy){ closeCloud(); clearCasting(); } });
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){ if($("#scrollWrap").classList.contains("open")) $("#scrollWrap").classList.remove("open"); else if(cloudWrap.classList.contains("open") && !busy){ closeCloud(); clearCasting(); } }
});
})();
</script>
