<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peptopia Health</title>
<meta property="og:image" content="https://x-peps.com/X-Peps/IMG_3345.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://x-peps.com/X-Peps/IMG_3345.png">
<meta name="description" content="Peptopia Health — Training & Education">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=DM+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'DM Sans',sans-serif;
    background:#f7f5fc;
    color:#1e1b4b;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .3s,color .3s;
  }
  html.dark body{background:#14101f;color:#f1f5f9}

  .holder{
    width:100%;
    max-width:560px;
    margin:0 auto;
    padding:48px 24px 64px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* Logo — homepage construction, hero size */
  .peptopia-logo{width:136px;height:136px;border-radius:50%;flex:none;box-shadow:0 0 10px 2px rgba(236,72,153,.55),0 0 26px 8px rgba(236,72,153,.18)}
  /* Dark logo (dark circle) shows on LIGHT theme; light logo (light circle) shows on DARK theme */
  .peptopia-logo.logo-light{display:none}
  html.dark .peptopia-logo.logo-light{display:block}
  html.dark .peptopia-logo.logo-dark{display:none}

  .brand-name{
    font-family:'Outfit',sans-serif;
    font-weight:800;
    font-size:1.55rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin:26px 0 0;
    color:#1e1b4b;
  }
  html.dark .brand-name{color:#f1f5f9}

  .statement{
    font-family:'Outfit',sans-serif;
    font-weight:800;
    font-size:2.6rem;
    line-height:1.15;
    color:#EA580C;
    margin:30px 0 0;
  }

  .email-wrap{width:min(300px,82vw);margin:40px auto 0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 24px;border-radius:10px;font-family:'Outfit',sans-serif;font-size:.85rem;font-weight:700;text-transform:uppercase;color:#fff;width:100%;transition:filter .3s;text-decoration:none}
  .btn{white-space:nowrap}
  .btn{padding:6px 22px;border-radius:999px;border:1.5px solid rgba(15,23,42,.28);
    box-shadow:inset 0 2px 3px rgba(255,255,255,.9),inset 0 -4px 7px rgba(0,0,0,.34),0 9px 18px rgba(15,23,42,.38),0 2px 4px rgba(15,23,42,.35);
    text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .btn:hover{filter:brightness(1.1)}
  .btn:active{transform:translateY(2px);
    box-shadow:inset 0 1px 2px rgba(255,255,255,.6),inset 0 -2px 4px rgba(0,0,0,.32),0 3px 7px rgba(15,23,42,.32)}
  .b-purple{background:linear-gradient(135deg,#7E22CE,#9333EA);color:#fff!important;text-shadow:0 1px 2px rgba(0,0,0,.35)}

  /* Theme toggle — homepage image-button construction */
  .theme-corner{position:fixed;top:16px;right:16px}
  .peptopia-iconbtn{width:38px;height:38px;flex:none;border-radius:50%;background:none;border:none;box-shadow:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .peptopia-iconbtn img{width:38px;height:38px;display:block;border-radius:50%;box-shadow:0 10px 16px rgba(15,23,42,.5),0 3px 5px rgba(15,23,42,.4)}
  .peptopia-iconbtn:active{transform:translateY(2px)}
  .peptopia-theme-toggle .pp-sun{display:none}
  html.dark .peptopia-theme-toggle .pp-sun{display:block}
  html.dark .peptopia-theme-toggle .pp-moon{display:none}

  @media (max-width:480px){
    .holder{padding:40px 18px 56px}
    .peptopia-logo{width:112px;height:112px}
    .brand-name{font-size:1.3rem}
    .statement{font-size:2rem}
  }
</style>
</head>
<body>
  <div class="theme-corner">
    <button type="button" class="peptopia-iconbtn peptopia-theme-toggle" onclick="toggleTheme()" title="Toggle light / dark" aria-label="Toggle theme"><img class="pp-moon" src="https://x-peps.com/X-Peps/btn-moon.png?v=3" alt="Dark theme"><img class="pp-sun" src="https://x-peps.com/X-Peps/btn-sun.png?v=3" alt="Light theme"></button>
  </div>
  <main class="holder">
    <img class="peptopia-logo logo-dark" src="https://x-peps.com/X-Peps/IMG_3345.png" alt="Peptopia Health">
    <img class="peptopia-logo logo-light" src="https://x-peps.com/X-Peps/IMG_3346.png" alt="Peptopia Health">
    <h1 class="brand-name">Peptopia Health</h1>
    <p class="statement">Training &amp; Education</p>
    <div class="email-wrap">
      <a class="btn b-purple" href="/email/">Email</a>
    </div>
  </main>
  <script>
    function toggleTheme(){document.documentElement.classList.toggle('dark');}
  </script>
</body>
</html>
