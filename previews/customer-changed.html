<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/admin-portal/apple-touch-icon.png">
<link rel="apple-touch-icon" href="/admin-portal/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step 1 — What Changed — Copy &amp; Paste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #FFF7ED; color: #241533; padding: 16px; }
  h1 { font-family: 'Outfit', sans-serif; font-weight: 800; color: #EA580C; font-size: 22px; margin-bottom: 10px; }
  .card { background: #FFFFFF; border: 2px solid #FDBA74; border-radius: 14px; padding: 16px; max-width: 640px; margin: 0 auto; }
  pre { font-family: 'DM Sans', sans-serif; font-size: 17px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  button { display: block; width: 100%; max-width: 640px; margin: 12px auto 0 auto; height: 26px; padding: 2px 10px; border: none; border-radius: 13px; background: linear-gradient(180deg, #FBBF24, #F59E0B); color: #241533; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 14px; line-height: 22px; cursor: pointer; }
  #msg { text-align: center; font-size: 14px; color: #15803D; height: 20px; margin-top: 6px; font-weight: 700; }
</style>
</head>
<body>
<div class="card">
<h1>Step 1 — What Changed</h1>
<pre id="txt">Our website and order methods changed:

Payment processors cracked down on peptide companies and closed our accounts—CashApp, credit cards, etc. the new process is unfortunately 1990 all over again—money orders or personal checks. If you are local, we can accept cash.</pre>
</div>
<button id="copyBtn" type="button">Copy text</button>
<div id="msg"></div>
<script>
document.getElementById('copyBtn').addEventListener('click', function () {
  var t = document.getElementById('txt').innerText;
  var done = function () { document.getElementById('msg').textContent = 'Copied — ready to paste'; };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done, function () { fallback(); });
  } else { fallback(); }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = t;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }
});
</script>
</body>
</html>
